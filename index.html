<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="A ready-to-use chat interface—configured via a chat builder—built on top of our UI Kits." />
    <link rel="manifest" href="/manifest.json" />
    <title>CometChat Chat Builder App</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      Entry stays at src/index.tsx rather than Vite's conventional src/main.tsx: the dashboard's
      export patcher locates the credentials block with `path.endsWith('index.tsx')`, so renaming
      it would silently break credential injection for downloaded apps.
    -->
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
